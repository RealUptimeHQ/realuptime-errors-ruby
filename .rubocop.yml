# The Ruby SDK's linter configuration (RuboCop). The gate runs it through
# scripts/lint-sdks.mjs. The point is the cops that find mistakes: Lint,
# Security and Gemspec. Layout, Style, Naming and Metrics are about taste and
# method size, so they are off rather than argued case by case.
AllCops:
  TargetRubyVersion: 2.6
  NewCops: disable
  SuggestExtensions: false

Layout:
  Enabled: false

Style:
  Enabled: false

Naming:
  Enabled: false

Metrics:
  Enabled: false
